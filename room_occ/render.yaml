databases:
  - name: room_occdb
    plan: free
    databaseName: room_occ
    user: room_occ

services:
  - type: web
    plan: free
    name: room_occ
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn room_occ.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: room_occdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4